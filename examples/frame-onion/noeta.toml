[package]
name = "noeta/frame_onion"
version = "0.1.0"

# The onion is a composition of TWO sibling packages, so an app lists all three under the single
# `para` scope key as an array (multi-package-per-scope resolution): the web framework, the LiveView
# engine, and the package that layers one over the other.
[dependencies]
para = [
    { version = "^0.4", package = "para/aether" },
    { version = "^0.5", package = "para/html" },
    { path = "../.." },
]

# The `@html { … }` tier directive this demo writes (`page_stub`). A tier is BOUND, never imported:
# `use para.html` no longer enables `@html`, and the binding — naming the PACKAGE, since the `para`
# key is a scope array covering three members and cannot say which one was meant — is what links
# para/html's tier handler into this program.
[directives]
html = "para/html"
