[package]
name = "para/aether_html"
version = "0.2.0"
# The minimum noeta this package works with; enforced at resolve time from noeta 0.2.1 on.
toolchain = ">=0.3"
license = "MIT OR Apache-2.0"
description = "The per-frame onion for para/html LiveView pages — authorization, rate limiting, and tracing per websocket frame, in aether's vocabulary."
keywords = ["liveview", "web", "aether", "middleware", "websocket"]

# The frame onion for para/html LiveView pages under para/aether. A PURE-Noeta package (no native
# half of its own): it composes the `SessionStore` trait + `Session` currency from para/aether with
# the `Wake` seam and `handle_all` entry point from para/html.
#
# It therefore depends on TWO sibling packages of the same `para` scope, bound under one `para` scope
# key as an array — the multi-package-per-scope resolution (`Dependency::Scope`) an app uses, here on
# a PACKAGE. This is why the onion lives in its own companion package rather than in either
# dependency: para/html must not depend on the web framework (it is std-only and standalone-servable,
# and both properties would be lost), and folding it into aether-core would make the LiveView engine,
# its tier handler, and its reconciler mandatory for every aether app, including the REST-only ones.
# An app opts in by adding `para/aether-html` to the `para` scope it already lists aether (and
# para/html) under.
#
# para/html is pinned to ^0.4: the `Wake` seam this package layers over landed in 0.3, and 0.4 both
# collapsed the entry points into one `handle` with named arguments and added the `base:` mounting
# this package's `LiveMount` is built on.
[dependencies]
para = [
    { version = "^0.2", package = "para/aether" },
    { version = "^0.4", package = "para/html" },
]
